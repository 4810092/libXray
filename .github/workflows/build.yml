name: Build libXray

on:
  workflow_dispatch:

concurrency:
  group: build-libxray-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: r29

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux
            arch: x64
            artifact: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux
            arch: arm64
            artifact: linux-arm64
          - runner: ubuntu-24.04
            target: android
            artifact: android
          - runner: windows-2022
            target: windows
            arch: x64
            goarch: amd64
            artifact: windows-x64
          - runner: macos-26
            target: apple
            artifact: apple-cgo
          - runner: macos-26
            target: apple-gomobile
            artifact: apple-gomobile

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read

    env:
      CGO_ENABLED: "1"

    steps:
      # =========================
      # Checkout
      # =========================
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # =========================
      # Python (build scripts)
      # =========================
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"
          check-latest: true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip

      # =========================
      # Go setup
      # =========================
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          check-latest: false

      - name: Download Go modules
        run: go mod download

      # =========================
      # Apple toolchain
      # =========================
      - name: Select Xcode
        if: startsWith(matrix.target, 'apple')
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      # =========================
      # Android toolchain
      # =========================
      - name: Setup Java (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Setup Android NDK
        if: matrix.target == 'android'
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      # =========================
      # Build steps
      # =========================

      - name: Build Linux
        if: matrix.target == 'linux'
        run: |
          python3 build/main.py linux

      - name: Build Android
        if: matrix.target == 'android'
        run: |
          python3 build/main.py android

      - name: Verify Android native libraries
        if: matrix.target == 'android'
        env:
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          aar_dir="$(mktemp -d)"
          unzip -q libXray.aar -d "$aar_dir"
          expected_abis="arm64-v8a armeabi-v7a x86 x86_64"
          for abi in $expected_abis; do
            test -f "$aar_dir/jni/$abi/libgojni.so"
          done
          readelf="$NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          while IFS= read -r library; do
            while read -r alignment; do
              if (( alignment < 0x4000 )); then
                echo "$library has LOAD alignment $alignment, expected at least 0x4000"
                exit 1
              fi
            done < <("$readelf" -lW "$library" | awk '$1 == "LOAD" { print $NF }')
          done < <(find "$aar_dir/jni" -name '*.so' -type f)

      - name: Build Windows
        if: matrix.target == 'windows'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          python build/main.py windows

      - name: Verify Windows architecture
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("windows_dll/libXray.dll")
          $peOffset = [System.BitConverter]::ToInt32($bytes, 0x3c)
          $machine = [System.BitConverter]::ToUInt16($bytes, $peOffset + 4)
          $expected = switch ("${{ matrix.arch }}") {
            "x64" { 0x8664 }
            "arm64" { 0xaa64 }
            default { throw "unsupported Windows architecture: ${{ matrix.arch }}" }
          }
          if ($machine -ne $expected) {
            throw ("unexpected PE machine 0x{0:X4}; expected 0x{1:X4}" -f $machine, $expected)
          }

      - name: Build Apple (macOS/iOS)
        if: matrix.target == 'apple'
        run: |
          python3 build/main.py apple go

      - name: Build Apple with gomobile
        if: matrix.target == 'apple-gomobile'
        run: |
          python3 build/main.py apple gomobile

      - name: Verify Apple gomobile framework
        if: matrix.target == 'apple-gomobile'
        shell: bash
        run: |
          set -euo pipefail
          test -f LibXray.xcframework/ios-arm64/LibXray.framework/LibXray
          test -f LibXray.xcframework/ios-arm64_x86_64-simulator/LibXray.framework/LibXray
          grep -q 'LibXrayInvoke' \
            LibXray.xcframework/ios-arm64/LibXray.framework/Headers/LibXray.objc.h

      # =========================
      # Collect artifacts
      # =========================
      - name: Package artifacts
        shell: bash
        run: |
          set -e

          case "${{ matrix.target }}" in
            linux)
              mkdir -p "dist/${{ matrix.artifact }}"
              cp linux_so/libXray.so "dist/${{ matrix.artifact }}/"
              cp linux_so/libXray.h "dist/${{ matrix.artifact }}/"
              ;;
            windows)
              mkdir -p "dist/${{ matrix.artifact }}"
              cp windows_dll/libXray.dll "dist/${{ matrix.artifact }}/"
              cp windows_dll/libXray.h "dist/${{ matrix.artifact }}/"
              ;;
            android)
              mkdir -p "dist/${{ matrix.artifact }}"
              cp libXray.aar "dist/${{ matrix.artifact }}/"
              cp libXray-sources.jar "dist/${{ matrix.artifact }}/"
              ;;
            apple)
              mkdir -p "dist/${{ matrix.artifact }}"
              cp -R LibXray.xcframework "dist/${{ matrix.artifact }}/"
              ;;
            apple-gomobile)
              mkdir -p "dist/${{ matrix.artifact }}"
              cp -R LibXray.xcframework "dist/${{ matrix.artifact }}/"
              ;;
          esac

      # =========================
      # Upload artifacts
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libxray-${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/
          if-no-files-found: error
